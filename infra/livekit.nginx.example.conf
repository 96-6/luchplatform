# Add this location to the HTTPS virtual host of the LUCH application.
# SFU port 7880 is private: do not proxy it directly to the Internet.
# Keep the application's usual TLS, proxy headers and trusted proxy configuration.
location /api/v1/video/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Meeting attachments: the application enforces the configured per-file limit.
# This ceiling supports the full range of the superadmin setting (1–1024 MiB).
location ~ ^/api/v1/meetings/[0-9a-f-]+/files/[0-9a-f-]+$ {
    client_max_body_size 1024m;
    client_body_timeout 1800s;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_request_buffering off;
    proxy_buffering off;
}
