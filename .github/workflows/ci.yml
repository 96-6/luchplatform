name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: luch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: luch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luch -d luch_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Embedded PostgreSQL and persistence checks
        run: npm test
      - name: Native PostgreSQL driver checks
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://luch:ci-only-password@127.0.0.1:5432/luch_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Docker Compose startup and persisted write
        run: |
          node scripts/setup.mjs --compose
          docker compose --env-file .env.compose up --build -d --wait
          node scripts/compose-smoke.mjs
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js seed-demo
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js seed-demo
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js export --package luch-demo --file /tmp/luch-demo-export.json
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js validate --file /tmp/luch-demo-export.json
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js import --file /tmp/luch-demo-export.json
          docker compose --env-file .env.compose exec -T app node scripts/engine-smoke.mjs
          docker compose --env-file .env.compose exec -T app node scripts/diagnostic-smoke.mjs
          docker compose --env-file .env.compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          node scripts/compose-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node scripts/engine-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node scripts/diagnostic-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node scripts/plan-smoke.mjs
          docker compose --env-file .env.compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          docker compose --env-file .env.compose exec -T app node scripts/plan-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node scripts/adaptation-smoke.mjs
          docker compose --env-file .env.compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          docker compose --env-file .env.compose exec -T app node scripts/adaptation-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node scripts/assistant-smoke.mjs
          docker compose --env-file .env.compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          docker compose --env-file .env.compose exec -T app node scripts/assistant-smoke.mjs verify
          docker compose --env-file .env.compose exec -T app node apps/api/dist/modules/content/cli.js export --package luch-demo --file /tmp/luch-demo-reopened.json
          docker compose --env-file .env.compose exec -T app node --input-type=module -e 'import { readFile } from "node:fs/promises"; import assert from "node:assert/strict"; const a=JSON.parse(await readFile("/tmp/luch-demo-export.json","utf8")); const b=JSON.parse(await readFile("/tmp/luch-demo-reopened.json","utf8")); assert.deepEqual(a,b); assert.deepEqual([b.routes.length,b.lessons.length,b.exercises.length],[2,12,48]);'
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env.compose logs --no-color || true
      - name: Stop test containers
        if: always()
        run: docker compose --env-file .env.compose down || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7
